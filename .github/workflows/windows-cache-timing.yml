name: Windows cache timing

on:
  workflow_dispatch:
  push:
    branches:
      - diag/windows-cache-timing

permissions:
  contents: read

jobs:
  cached:
    name: Cached setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Keep only the go-modules tool set
        shell: bash
        run: rm mise.toml mise.lock

      - name: Set up mise
        uses: ./
        with:
          working_directory: diag

      - name: Time extraction variants
        if: runner.os == 'Windows'
        shell: pwsh
        run: diag/extract-timing.ps1

      - name: Time extraction
        if: runner.os == 'Linux'
        run: diag/extract-timing.sh

  vhdx:
    name: VHDX volumes (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Keep only the go-modules tool set
        shell: bash
        run: rm mise.toml mise.lock

      - name: Set up mise
        uses: ./
        with:
          working_directory: diag

      - name: Create ReFS Dev Drive, ReFS and NTFS VHDX volumes on drive D
        shell: pwsh
        run: diag/new-vhdx.ps1

      - name: Time extraction variants on the VHDX volumes
        shell: pwsh
        run: diag/extract-timing.ps1 -Drives R, F, N -SkipDefender

  cold:
    name: Cold install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Keep only the go-modules tool set
        shell: bash
        run: rm mise.toml mise.lock

      - name: Set up mise without cache
        uses: ./
        with:
          working_directory: diag
          cache: false
