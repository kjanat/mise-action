name: Windows cache timing

on:
  workflow_dispatch:
  push:
    branches:
      - diag/windows-cache-timing

permissions:
  contents: read

jobs:
  save:
    name: Save mise cache (${{ matrix.drive }}:)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - drive: C
            mise_dir: C:\Users\runneradmin\AppData\Local\mise
          - drive: D
            mise_dir: D:\mise
    steps:
      - uses: actions/checkout@v7

      - name: Keep only the go-modules tool set
        shell: bash
        run: rm mise.toml mise.lock

      - name: Set up mise
        uses: ./
        with:
          working_directory: diag
          mise_dir: ${{ matrix.mise_dir }}

  restore:
    name: Restore (${{ matrix.drive }}:, ${{ matrix.tar }} tar, ${{ matrix.attempt }})
    needs: save
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        drive: [C, D]
        tar: [Git, System32]
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - name: Keep only the go-modules tool set
        shell: bash
        run: rm mise.toml mise.lock

      - name: Set up mise with jdx/mise-action@v5
        if: matrix.tar == 'Git'
        uses: jdx/mise-action@v5
        with:
          working_directory: diag
          mise_dir: ${{ matrix.drive == 'D' && 'D:\mise' || 'C:\Users\runneradmin\AppData\Local\mise' }}

      - name: Set up mise with the patched action
        if: matrix.tar == 'System32'
        uses: ./
        with:
          working_directory: diag
          mise_dir: ${{ matrix.drive == 'D' && 'D:\mise' || 'C:\Users\runneradmin\AppData\Local\mise' }}

  cold:
    name: Cold install (${{ matrix.action }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        action: [jdx/mise-action@v5, patched]
    steps:
      - uses: actions/checkout@v7

      - name: Keep only the go-modules tool set
        shell: bash
        run: rm mise.toml mise.lock

      - name: Set up mise with jdx/mise-action@v5
        if: matrix.action != 'patched'
        uses: jdx/mise-action@v5
        with:
          working_directory: diag
          cache: false

      - name: Set up mise with the patched action
        if: matrix.action == 'patched'
        uses: ./
        with:
          working_directory: diag
          cache: false
